name: Build Android APK 1.0.0 Final

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Josip Pozega Tus Glava 1.0.0
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Preuzmi repozitorij
        uses: actions/checkout@v4

      - name: Raspakiraj Android projekt
        run: |
          rm -rf project
          mkdir -p project
          unzip -q Josip_Pozega_Tus_Glava_1.0.0_Final_Izvorni_Kod.zip -d project

      - name: Provjeri izvorni ZIP
        run: unzip -t Josip_Pozega_Tus_Glava_1.0.0_Final_Izvorni_Kod.zip > /dev/null

      - name: Postavi Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Pripremi Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Pripremi Gradle
        working-directory: project
        run: chmod +x gradlew

      - name: Kompajliraj finalni debug APK
        working-directory: project
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Spremi gotovi APK
        uses: actions/upload-artifact@v4
        with:
          name: Josip-Pozega-Tus-Glava-1.0.0-Final
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
