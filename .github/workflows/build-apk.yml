name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Josip Pozega Tus Glava
    runs-on: ubuntu-latest

    steps:
      - name: Preuzmi repozitorij
        uses: actions/checkout@v4

      - name: Raspakiraj Android projekt
        run: |
          mkdir -p project
          unzip -q Josip_Pozega_Tus_Glava_0.2.0_Deep_Scan_Izvorni_Kod.zip -d project

      - name: Postavi Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Postavi Android SDK
        uses: android-actions/setup-android@v3

      - name: Prihvati Android licence
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Instaliraj Android SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.1"

      - name: Pripremi Gradle
        working-directory: project
        run: chmod +x gradlew

      - name: Kompajliraj debug APK
        working-directory: project
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Spremi gotovi APK
        uses: actions/upload-artifact@v4
        with:
          name: Josip-Pozega-Tus-Glava-0.2.0-Deep-Scan
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
